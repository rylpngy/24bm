name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 单测均以 mock 隔离,无需数据库;集成测试(*IT)由 Testcontainers 自起容器。
      - name: Backend tests (unit + integration)
        working-directory: backend-java
        run: mvn -B -ntp -Pintegration verify
      - name: Require executed integration tests
        run: python3 scripts/check-integration-results.py backend-java/target/failsafe-reports

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本以 package.json 的 packageManager 为准,不在此重复指定。
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages + apps)
        run: pnpm typecheck:all
      - name: 测试日期定时炸弹检查(禁止未来日期字面量)
        run: node scripts/check-test-dates.mjs
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Production build
        run: pnpm build:all

  e2e:
    name: E2E (Playwright, 三端)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procurement_saas
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement_saas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # 登录链路走 Keycloak(演示 realm),用 docker run 以便挂载仓库内 realm 文件。
      - name: Start Keycloak (realm import) in background
        run: |
          docker run -d --name keycloak -p 8081:8081 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak/realm:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --http-port=8081 --import-realm
      - name: Start backend (demo 种子) in background
        working-directory: backend-java
        env:
          # 种子走独立链(flyway_seed_history);显式指向 db/demo,覆盖 local profile 默认的 db/dev。
          APP_SEED_LOCATIONS: classpath:db/demo
        run: |
          nohup mvn -B -ntp spring-boot:run -Dspring-boot.run.profiles=local > /tmp/backend.log 2>&1 &
          # 编译+迁移在冷缓存下可能超过 3 分钟;等不到就直接失败,避免 E2E 在后端未就绪时开跑。
          for i in $(seq 1 150); do
            curl -sf http://localhost:8080/api/v1/health && exit 0
            sleep 3
          done
          echo "backend did not become healthy within 450s" >&2
          tail -80 /tmp/backend.log >&2
          exit 1
      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/realms/24bid/.well-known/openid-configuration >/dev/null && exit 0 || sleep 3
          done
          echo "Keycloak realm not ready" >&2
          docker logs keycloak | tail -50 >&2
          exit 1
      - name: Run E2E (webServer 自起三端 dev)
        run: pnpm exec playwright test
      - name: Dump backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
