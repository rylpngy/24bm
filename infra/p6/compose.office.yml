name: 24bm-p6-office
services:
  office:
    image: onlyoffice/documentserver@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b
    cpus: 1
    mem_limit: 1400m
    oom_score_adj: 1000
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${OFFICE_JWT_SECRET:?required}
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'false'
      PLUGINS_ENABLED: 'false'
    ports: ['127.0.0.1:18088:80']
    volumes:
      - office-data:/var/www/onlyoffice/Data
      - office-cache:/var/lib/onlyoffice
volumes:
  office-data:
  office-cache:
