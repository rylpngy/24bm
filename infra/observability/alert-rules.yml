# 告警规则:实例宕机 / 5xx 错误率 / P95 延迟 / JVM 堆占用。
# 指标来自 micrometer-registry-prometheus(http_server_requests_seconds_*、jvm_memory_*)。
groups:
  - name: 24bid-backend
    rules:
      - alert: BackendInstanceDown
        expr: up{job="24bid-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 后端实例宕机
          description: '{{ $labels.instance }} 已 1 分钟无法抓取 /actuator/prometheus。'

      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 5xx 错误率超过 5%
          description: '近 5 分钟服务端错误率 {{ $value | humanizePercentage }}。'

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 请求 P95 延迟超过 1.5s
          description: '近 5 分钟 P95 延迟 {{ $value }}s。'

      - alert: HighJvmHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
            / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: JVM 堆占用超过 90%
          description: '堆占用 {{ $value | humanizePercentage }},可能存在内存压力。'
