# Prometheus 抓取配置:抓后端 Spring Boot Actuator 暴露的 /actuator/prometheus。
# compose 网络内服务名 app:8080;本机直跑可改 host.docker.internal:8080。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 24bid-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 24bid
