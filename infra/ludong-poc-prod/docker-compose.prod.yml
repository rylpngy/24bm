name: 24bid-ludong-poc

services:
  postgres:
    image: postgres:16.4-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-procurement_saas}
      POSTGRES_USER: ${DB_USERNAME:-procurement}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-procurement} -d ${DB_NAME:-procurement_saas}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    platform: linux/amd64
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  app:
    image: 24bid/ludong-backend:${BACKEND_IMAGE_TAG:-poc-20260902}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-procurement_saas}
      DB_USERNAME: ${DB_USERNAME:-procurement}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-24bid-attachments}
      APP_SEED_LOCATIONS: classpath:db/poc/ludong
      SELF_LOGIN_ENABLED: "true"
      KEYCLOAK_ENABLED: "false"
      TENANT_HEADER_FALLBACK_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ALLOW_DEMO_JWT_SECRET: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${PORTAL_PORT:-5173}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [backend]

  portal:
    image: 24bid/ludong-portal:${PORTAL_IMAGE_TAG:-poc-20260902}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge: {}
