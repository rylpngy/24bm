server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: procurement-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procurement_saas}
    username: ${DB_USERNAME:procurement}
    password: ${DB_PASSWORD:procurement}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

procurement:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-non-local-environments}
    jwt-expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
    # 自研 JWT 签发(/auth/login)开关:生产以 Keycloak 为唯一签发方时置 false 退役;
    # 默认 true 仅为 CI/测试确定性(令牌验签仍双签发器共存)。
    self-issued-login-enabled: ${SELF_LOGIN_ENABLED:true}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio12345}
      bucket: ${MINIO_BUCKET:24bid-attachments}

# Flowable 工作流引擎(内嵌):自建 ACT_* 表(Liquibase),关闭异步执行器降低本地噪声。
flowable:
  database-schema-update: true
  async-executor-activate: false
  process-definition-location-prefix: classpath:/processes/

# Keycloak(OIDC):后端作为资源服务器,通过 JWKS 验签 Keycloak 令牌(与自研 JWT 双签发器共存)。
keycloak:
  enabled: ${KEYCLOAK_ENABLED:true}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/24bid/protocol/openid-connect/certs}
