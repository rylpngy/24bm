server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: procurement-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procurement_saas}
    username: ${DB_USERNAME:procurement}
    password: ${DB_PASSWORD:procurement}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # 业务迁移链:只跑 db/migration。种子(demo/dev)走独立链,见 app.seed.locations。
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

# 种子数据独立迁移链(flyway_seed_history):演示环境=classpath:db/demo;干净库留空。
app:
  deployment:
    # 部署形态:full=完整采购平台;mall=商城直采版(寻源/招标接口面关闭,见 DeploymentSurfaceFilter)。
    # 同一份代码与镜像,按形态售卖与部署,不分叉第二套代码库。
    profile: ${APP_DEPLOYMENT_PROFILE:full}
  seed:
    locations: ${APP_SEED_LOCATIONS:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 可观测性:暴露健康/信息/指标/Prometheus 抓取端点(/actuator/**)。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: 24Bid Procurement SaaS
    description: 多租户采购协同管理 SaaS 后端

procurement:
  ai:
    # External requests require explicit enablement and all three provider settings.
    enabled: ${PROCUREMENT_AI_ENABLED:false}
    endpoint: ${PROCUREMENT_AI_ENDPOINT:}
    api-key: ${PROCUREMENT_AI_API_KEY:}
    model: ${PROCUREMENT_AI_MODEL:}
  ludong-poc:
    ai-review:
      # 可选 OpenAI 兼容 chat/completions 接口。未配置时使用本地采购规则模型，不影响审批办理。
      endpoint: ${LUDONG_AI_REVIEW_ENDPOINT:}
      api-key: ${LUDONG_AI_REVIEW_API_KEY:}
      model: ${LUDONG_AI_REVIEW_MODEL:gpt-4.1-mini}
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-non-local-environments}
    jwt-expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
    # 生产置 false:JWT_SECRET 缺失或仍为演示占位时启动即失败(与中标通知书 allow-demo-secret 同模式)。
    allow-demo-jwt-secret: ${ALLOW_DEMO_JWT_SECRET:true}
    # 自研 JWT 签发(/auth/login)开关:生产以 Keycloak 为唯一签发方时置 false 退役;
    # 默认 true 仅为 CI/测试确定性(令牌验签仍双签发器共存)。
    self-issued-login-enabled: ${SELF_LOGIN_ENABLED:true}
    # 无 Bearer 时信任 X-Tenant-Id 等请求头的旧原型兼容路径;默认关闭,生产禁止开启。
    tenant-header-fallback-enabled: ${TENANT_HEADER_FALLBACK_ENABLED:false}
    # CORS 来源白名单(逗号分隔);默认包含四端 dev、preview 与鲁东 POC 本地端口(5188)。
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5188,http://127.0.0.1:5188,http://localhost:4173,http://127.0.0.1:4173}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio12345}
      bucket: ${MINIO_BUCKET:24bid-attachments}

# Flowable 工作流引擎(内嵌):流程定义只允许由受控配置发布服务动态部署。
# 历史 classpath:/processes/ 固定 BPMN 保留源码追溯，但不会随应用启动自动部署。
flowable:
  database-schema-update: true
  async-executor-activate: false
  process-definition-location-prefix: classpath:/workflow-runtime-disabled/

# Keycloak(OIDC):后端作为资源服务器,通过 JWKS 验签 Keycloak 令牌(与自研 JWT 双签发器共存)。
keycloak:
  enabled: ${KEYCLOAK_ENABLED:true}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/24bid/protocol/openid-connect/certs}
