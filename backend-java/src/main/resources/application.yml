server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: procurement-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procurement_saas}
    username: ${DB_USERNAME:procurement}
    password: ${DB_PASSWORD:procurement}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

procurement:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-non-local-environments}
    jwt-expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
